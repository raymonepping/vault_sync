# compose/app/compose.yaml: the Lumen Parcel console (prompts 05, 06).
#
#   web-init  one-shot: the web certificate for nginx (uid 101)
#   api       the presenter's desk: runs Secrets Import and Secrets Sync as
#             the signed-in presenter (her token lives only in its memory,
#             D13), reads LocalStack and GitHub's evidence (read-only)
#   web       nginx over TLS 1.3; React console + /api proxy
#
# No credential is mounted: the presenter types her password, and the API
# holds her token in memory only. Images: make app-build.

services:
  web-init:
    image: ${ALPINE_IMAGE}
    container_name: vaultsync-web_init
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -m 0750 -o 101 -g 101 /web-tls &&
        install -m 0644 -o 101 -g 101 /src/vault.crt /web-tls/web.crt &&
        install -m 0600 -o 101 -g 101 /src/vault.key /web-tls/web.key &&
        install -m 0644 -o 101 -g 101 /src/ca-chain.pem /web-tls/ca-chain.pem &&
        echo '[web-init] done'
    volumes:
      - web-tls:/web-tls
      - ../../vault-tls:/src:ro
    restart: "no"

  api:
    image: ${VSYNC_IMAGE_PREFIX}/api:${VSYNC_IMAGE_TAG}
    container_name: vaultsync-api
    hostname: api
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # The import config (0600) lives here for one run. The Vault image
    # declares VOLUME /vault/logs and /vault/file: tmpfs there, or Podman
    # makes two anonymous volumes on every recreate.
    tmpfs: [/tmp, /vault/logs, /vault/file]
    environment:
      PORT: "3000"
      HOME: /tmp
      VAULT_NODES: https://vault-1:8200,https://vault-2:8200,https://vault-3:8200
      VSYNC_NAMESPACE: ${VSYNC_NAMESPACE}
      VSYNC_AWS_REGION: ${VSYNC_AWS_REGION}
      VSYNC_LOCALSTACK_IP: ${VSYNC_LOCALSTACK_IP}
      LOCALSTACK_URL: https://localstack:4566
      CONSOLE_USER: ines
      STORY_FILE: /app/config/story.json
      GITHUB_EVIDENCE_FILE: /evidence/github/evidence.json
      SESSION_IDLE_SECONDS: "${VSYNC_SESSION_IDLE}"
      CONSOLE_URL: https://localhost:${VSYNC_PORT_WEB},https://127.0.0.1:${VSYNC_PORT_WEB}
      NODE_EXTRA_CA_CERTS: /etc/vsync/ca-chain.pem
      VAULT_CACERT: /etc/vsync/ca-chain.pem
      SSL_CERT_DIR: /etc/ssl/certs:/etc/vsync
    volumes:
      - ../../vault-tls/ca-chain.pem:/etc/vsync/ca-chain.pem:ro
      # make github-evidence writes here on the host (D15); a directory, so a
      # replaced file is seen at once.
      - ../../.build/github:/evidence/github:ro
    mem_limit: 384m
    networks: [default]
    restart: unless-stopped

  web:
    image: ${VSYNC_IMAGE_PREFIX}/web:${VSYNC_IMAGE_TAG}
    container_name: vaultsync-web
    hostname: web
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports: ["127.0.0.1:${VSYNC_PORT_WEB}:8443"]
    volumes:
      - web-tls:/etc/nginx/tls:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      web-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  default:
    name: vaultsync-internal
    external: true

volumes:
  web-tls: {}

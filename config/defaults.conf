# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. Identifiers only:
# never a secret. Dependabot cannot parse this file: bump images by hand, then
# run make verify, make rehearsal and make probe.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
# 2026.10.6 (2026-11-04, arm64): 2026.03.0 and later need LOCALSTACK_AUTH_TOKEN.
LOCALSTACK_IMAGE=docker.io/localstack/localstack:2026.10.6
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1; the API is not published) ────────
# In no sibling lab's defaults.conf and not listening on 2026-11-12.
VSYNC_PORT_VAULT_S=19600
VSYNC_PORT_VAULT_1=19601
VSYNC_PORT_VAULT_2=19602
VSYNC_PORT_VAULT_3=19603
VSYNC_PORT_WEB=14101
VSYNC_PORT_LOCALSTACK=14566

# ── Network (a fixed subnet: Vault reaches LocalStack at a known address) ────
VSYNC_SUBNET=10.89.240.0/24
VSYNC_LOCALSTACK_IP=10.89.240.50

# ── Vault ─────────────────────────────────────────────────────────────────────
VSYNC_NAMESPACE=lumen
VSYNC_SESSION_IDLE=14400

# ── GitHub (identifiers, not secrets; the app's key is in .secrets/github/) ──
VSYNC_GITHUB_OWNER=raymonepping
VSYNC_GITHUB_REPO=vault_sync
VSYNC_GITHUB_APP_ID=5725774
VSYNC_GITHUB_APP_NAME=vaultsyncdemo
# Found by scripts/github-installation.js (prompt 03): the app on vault_sync only.
VSYNC_GITHUB_INSTALLATION_ID=181185657

# ── LocalStack (synthetic AWS credentials: an emulator, never real AWS) ──────
VSYNC_AWS_REGION=eu-west-1

# ── Application images (make app-build) ───────────────────────────────────────
VSYNC_IMAGE_PREFIX=localhost/vault-sync
VSYNC_IMAGE_TAG=local

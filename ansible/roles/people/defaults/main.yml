people_ns: "{{ vsync_cluster_addr }}/v1/{{ vsync_namespace }}"
people_token: "{{ lookup('ansible.builtin.file', vsync_tokens_dir + '/ansible-platform') }}"
# Her token lives as long as the console session may idle (D13).
people_settings:
  token_policies: [vsync-presenter]
  token_ttl: "{{ vsync_session_idle | int }}"
  token_max_ttl: "{{ vsync_session_idle | int * 2 }}"
